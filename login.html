<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#194627">
  <title>Sign in · AzollaSense</title>
  <link rel="icon" type="image/svg+xml" href="./assets/logo.svg">
  <link rel="apple-touch-icon" href="./assets/logo.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="./css/style.css?v=54">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-mark" aria-hidden="true"><img src="./assets/logo.svg" alt=""></div>
    <h2>Welcome</h2>
    <p id="auth-intro" class="auth-intro">Sign in to continue to your dashboard.</p>
    <form id="auth-form" autocomplete="on">
      <label for="auth-username">Username</label>
      <input id="auth-username" name="username" autocomplete="username" required minlength="3" maxlength="40">
      <label for="auth-password">Password</label>
      <input id="auth-password" name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="256">
      <p id="auth-error" class="auth-error" role="alert" aria-live="polite"></p>
      <button id="auth-submit" class="auth-submit" type="submit" disabled>Login</button>
    </form>
    <p class="auth-local-note">Your account is stored on this Raspberry Pi. Internet access is not required.</p>
  </main>
  <script src="./js/auth.js?v=4" defer></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) =>
          console.log("Service Worker registration failed:", err),
        );
      });
    }
  </script>
</body>
</html>
